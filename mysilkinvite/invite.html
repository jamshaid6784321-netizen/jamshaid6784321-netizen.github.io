<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your invitation | My Silk Invite</title>
<link rel="icon" href="favicon.png" type="image/png">
<script src="personalize.js"></script>
<style>
  body{margin:0;font-family:Georgia,'Times New Roman',serif;background:#fdf8ec;color:#4a3226}
  .invite-shell{max-width:560px;margin:0 auto;padding:48px 20px;text-align:center}
  .invite-shell h1{font-size:28px;margin:0 0 12px}
  .invite-shell p{font-size:17px;line-height:1.6;color:#6b4a2a}
  .invite-shell a{color:#8e4a54}
  .invite-shell .btn{display:inline-block;margin-top:18px;padding:12px 26px;border-radius:999px;background:#8e4a54;color:#fff;text-decoration:none;font-size:17px}
</style>
</head>
<body>
<div class="invite-shell" id="inviteShell">
  <h1>My Silk Invite</h1>
  <p id="inviteMsg">Loading your invitation&hellip;</p>
</div>
<script>
(function () {
  var shell = document.getElementById("inviteShell");
  var msg = document.getElementById("inviteMsg");
  function showError(text) {
    if (msg) msg.textContent = text;
    var a = document.createElement("a");
    a.className = "btn";
    a.href = "builder.html";
    a.textContent = "Create your invitation";
    if (shell) shell.appendChild(a);
  }
  var params = new URLSearchParams(window.location.search || "");
  var slug = params.get("t") || "";
  var n1 = (params.get("n1") || "").trim();
  var dateISO = params.get("d") || "";
  if (!slug || !window.MSI || !window.MSI.DEMO || !window.MSI.DEMO[slug]) {
    showError("This invitation link is not valid. It may have been copied wrongly.");
    return;
  }
  if (!n1) {
    showError("This invitation is missing the couple's names. Please ask the sender for a fresh link, or create your own.");
    return;
  }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateISO) || isNaN(new Date(dateISO + "T12:00:00").getTime())) {
    showError("This invitation is missing a valid date. Please ask the sender for a fresh link, or create your own.");
    return;
  }
  var user = {
    n1: n1,
    n2: (params.get("n2") || "").trim(),
    dateISO: dateISO,
    time: params.get("tm") || "19:00",
    venue: params.get("v") || "",
    host: params.get("h") || "Together with their families",
    event: params.get("e") || "Wedding",
    photo: ""
  };
  fetch("templates/" + slug + ".html")
    .then(function (r) {
      if (!r.ok) throw new Error("template not found");
      return r.text();
    })
    .then(function (html) {
      var out = window.MSI.personalize(html, slug, user);
      document.open();
      document.write(out);
      document.close();
    })
    .catch(function () {
      showError("This invitation could not be loaded right now. Please try again, or create your own.");
    });
})();
</script>
</body>
</html>
